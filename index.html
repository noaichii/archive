<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9ad3b">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #d9ad3b;
      --ink: #006241;
      --muted: #285d48;
      --line: #b98429;
      --accent: #006241;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--paper);
      background-image:
        radial-gradient(ellipse at 18% 12%, rgb(255 239 176 / 35%), transparent 32%),
        radial-gradient(ellipse at 80% 24%, rgb(127 91 24 / 10%), transparent 38%),
        radial-gradient(ellipse at 34% 72%, rgb(255 245 195 / 22%), transparent 42%),
        repeating-linear-gradient(173deg, transparent 0 17px, rgb(107 76 22 / 5%) 18px, transparent 20px 39px),
        repeating-linear-gradient(82deg, transparent 0 29px, rgb(255 247 206 / 16%) 30px, transparent 32px 57px);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.55;
    }
    .page { position: relative; z-index: 1; width: min(1440px, 100%); margin: 0 auto; padding: 0 5vw 64px; }
    header { padding: clamp(30px, 6vw, 76px) 0 32px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); font-weight: 700; letter-spacing: .03em; }
    .question { margin: 18px 0 0; color: var(--muted); font-size: clamp(.95rem, 1.5vw, 1.1rem); }
    main { padding-top: 30px; }
    .collection-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .collection-head h2 { margin: 0; font-size: 1rem; font-weight: 600; }
    .count { margin: 0; color: var(--muted); font-size: .85rem; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2vw, 26px); }
    .card { min-width: 0; }
    .image-button { display: block; width: 100%; padding: 0; overflow: hidden; border: 0; background: #e8e4dc; cursor: zoom-in; }
    .image-button img { display: block; width: 100%; height: clamp(260px, 38vw, 510px); object-fit: cover; transition: transform .35s ease; }
    .image-button:hover img, .image-button:focus-visible img { transform: scale(1.025); }
    .image-button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .caption { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 1px 0; }
    .name { margin: 0; font-size: .95rem; font-weight: 600; }
    .words { margin: 0; color: var(--muted); font-size: .88rem; }
    .game-section { margin-top: clamp(52px, 9vw, 110px); padding: clamp(20px, 4vw, 42px); border: 1px solid rgb(111 73 51 / 30%); border-radius: 24px; background: rgb(255 248 218 / 78%); box-shadow: 0 18px 48px rgb(79 60 25 / 12%); }
    .game-gate { display: flex; align-items: center; justify-content: center; min-height: 150px; }
    .pickup-card { position: fixed; z-index: 10; display: block; width: 104px; height: 136px; padding: 6px; border-radius: 5px; background: #fffdf4; box-shadow: 0 10px 22px rgb(48 35 24 / 20%); pointer-events: none; }
    .pickup-card[hidden] { display: none; }
    .pickup-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .pickup-card.lifting { animation: pick-photo .8s cubic-bezier(.16,.72,.24,1) forwards; }
    @keyframes pick-photo { 0% { transform: translate(-50%, 0) rotate(-5deg) scale(.82); opacity: 0; } 20% { opacity: 1; } 52% { transform: translate(-50%, -72px) rotate(8deg) scale(1.08); opacity: 1; } 100% { transform: translate(-50%, -190px) rotate(15deg) scale(.72); opacity: 0; } }
    .game-button { min-height: 46px; padding: 11px 20px; border: 0; border-radius: 999px; background: var(--accent); color: #fff9e8; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 5px 0 #004a31; transition: transform .15s ease, box-shadow .15s ease; }
    .game-button:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #004a31; }
    .game-button:active { transform: translateY(3px); box-shadow: 0 2px 0 #004a31; }
    .game-button:focus-visible { outline: 3px solid #d06e2c; outline-offset: 3px; }
    .game-view[hidden], .game-gate[hidden] { display: none; }
    .game-status { min-height: 1.7em; margin: 0 0 14px; color: var(--ink); font-weight: 700; }
    .game-table { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 210px); align-items: center; gap: clamp(12px, 4vw, 48px); min-height: 390px; padding: clamp(14px, 4vw, 36px); overflow: hidden; border: 5px solid #514437; border-radius: 30px; background: radial-gradient(ellipse at 50% 45%, #42664a, #233d31 72%); box-shadow: inset 0 0 0 3px rgb(255 255 255 / 9%), 0 12px 22px rgb(57 43 28 / 20%); touch-action: none; }
    .pot-zone { position: relative; width: min(100%, 420px); aspect-ratio: 1; justify-self: center; border: 12px solid #4a3c30; border-radius: 50%; background: linear-gradient(145deg, #211f1d, #624b39 34%, #251f1b 70%); box-shadow: 0 13px 22px rgb(0 0 0 / 34%), inset 0 0 0 4px #8c7154; }
    .pot-broth { position: absolute; inset: 7%; overflow: visible; border: 5px solid #ceb58a; border-radius: 50%; background: radial-gradient(ellipse at 50% 46%, #ddc58f, #bd9b65 73%, #9e7549); box-shadow: inset 0 0 18px rgb(92 62 36 / 26%); }
    .pot-leaf { position: absolute; width: 24%; height: 10%; border-radius: 70% 35% 70% 35%; background: linear-gradient(15deg, #65834e, #9eaa67 48%, #e3d59c 51%, #788c50); opacity: .9; transform: rotate(var(--leaf-rotate)); }
    .pot-leaf:nth-child(1) { top: 12%; left: 18%; --leaf-rotate: 28deg; }
    .pot-leaf:nth-child(2) { top: 22%; right: 9%; --leaf-rotate: -35deg; }
    .pot-leaf:nth-child(3) { bottom: 12%; left: 9%; --leaf-rotate: -22deg; }
    .pot-leaf:nth-child(4) { right: 18%; bottom: 15%; --leaf-rotate: 44deg; }
    .pot-tofu { position: absolute; z-index: 2; display: grid; place-items: center; width: clamp(37px, 8vw, 56px); aspect-ratio: 1.15; padding: 0; border: 2px solid #eee9d8; border-radius: 12px 14px 11px 13px; background: linear-gradient(145deg, #fffef3, #e6e0ca); box-shadow: 0 4px 5px rgb(75 59 41 / 25%), inset -4px -4px 6px rgb(184 174 147 / 20%); color: transparent; font-size: 0; cursor: grab; touch-action: none; transition: opacity .2s, filter .2s; }
    .pot-tofu:focus-visible { outline: 3px solid #006241; outline-offset: 3px; }
    .pot-tofu.carried { z-index: 8; opacity: .82; cursor: grabbing; box-shadow: 0 0 0 2px #fff9e8, 0 0 20px #fff9e8; }
    .pot-tofu.broken { visibility: hidden; cursor: not-allowed; }
    .pot-tofu.crushed { opacity: .35; filter: grayscale(1); cursor: not-allowed; transform: scaleY(.28) rotate(8deg); }
    .pot-leek { position: absolute; z-index: 3; top: 9%; left: 43%; width: clamp(34px, 7vw, 58px); height: 36%; padding: 0; border: 0; background: transparent; cursor: grab; touch-action: none; transform: rotate(24deg); }
    .pot-leek img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 3px rgb(56 54 30 / 30%)); pointer-events: none; }
    .pot-leek.carried { z-index: 8; cursor: grabbing; filter: drop-shadow(0 0 7px #ffe36d); }
    .pot-leek.taken, .pot-leek.crushed { visibility: hidden; }
    .tofu-shard { position: absolute; z-index: 7; width: 24px; height: 20px; border: 1px solid #e8e0c9; border-radius: 4px 7px 3px 5px; background: linear-gradient(145deg, #fffef4, #ddd5bd); box-shadow: 0 2px 4px rgb(79 62 44 / 24%); animation: tofu-scatter .55s cubic-bezier(.15,.7,.25,1) both; pointer-events: none; }
    @keyframes tofu-scatter { 0% { opacity: 1; transform: translate(0,0) rotate(0) scale(1); } 55% { opacity: 1; transform: translate(var(--dx),var(--dy)) rotate(var(--turn)) scale(.9); } 100% { opacity: .92; transform: translate(var(--dx),var(--dy)) rotate(var(--turn)) scale(.82); } }
    .pot-tofu.served { visibility: hidden; }
    .tofu-1 { top: 25%; left: 31%; } .tofu-2 { top: 31%; left: 60%; } .tofu-3 { top: 48%; left: 16%; } .tofu-4 { top: 53%; left: 43%; } .tofu-5 { top: 66%; left: 66%; } .tofu-6 { top: 70%; left: 30%; } .tofu-7 { top: 45%; left: 73%; }
    .plate-zone { position: relative; display: grid; place-items: center; width: min(100%, 210px); aspect-ratio: 1; justify-self: center; border: 9px solid #d7cdb7; border-radius: 50%; background: radial-gradient(circle, #faf8ed 0 61%, #e8dfcb 62% 69%, #fbf9f0 70%); box-shadow: 0 12px 18px rgb(0 0 0 / 23%), inset 0 0 0 2px #fff; }
    .plate-zone::before { position: absolute; inset: 12%; border: 1px solid rgb(153 137 111 / 32%); border-radius: 50%; content: ""; }
    .plate-content { position: relative; display: grid; grid-template-columns: repeat(2, 36px); gap: 8px; min-height: 82px; align-content: center; justify-content: center; }
    .plate-tofu { width: 36px; aspect-ratio: 1.15; border: 1px solid #e5dec9; border-radius: 9px; background: linear-gradient(145deg, #fffef6, #e5dfcc); box-shadow: 0 2px 4px rgb(85 68 46 / 16%); animation: land-tofu .35s cubic-bezier(.2,.8,.25,1.3); }
    .plate-leek { grid-column: span 2; justify-self: center; width: 20px; height: 54px; object-fit: contain; transform: rotate(22deg); filter: drop-shadow(0 1px 2px rgb(56 54 30 / 24%)); }
    @keyframes land-tofu { from { opacity: 0; transform: translateY(-16px) rotate(-10deg) scale(.75); } to { opacity: 1; transform: translateY(0) rotate(0) scale(1); } }
    .plate-count { position: absolute; bottom: 17%; color: #74634e; font-size: .78rem; font-weight: 700; }
    .scoop-net { position: absolute; z-index: 9; display: none; width: 84px; aspect-ratio: 1; border: 5px solid rgb(255 250 232 / 90%); border-radius: 50%; background: repeating-linear-gradient(45deg, transparent 0 7px, rgb(255 250 232 / 37%) 8px 9px), repeating-linear-gradient(-45deg, transparent 0 7px, rgb(255 250 232 / 34%) 8px 9px); box-shadow: 0 0 0 3px rgb(57 52 41 / 36%), inset 0 0 0 2px rgb(91 75 49 / 22%); pointer-events: none; transform: translate(-50%, -50%); }
    .scoop-net.active { display: block; }
    .game-arm { position: absolute; z-index: 11; display: none; object-fit: fill; filter: drop-shadow(0 6px 5px rgb(0 0 0 / 30%)); pointer-events: none; }
    .game-arm.smashing { display: block; animation: arm-smash .82s cubic-bezier(.25,.78,.32,1) 1 both; }
    @keyframes arm-smash { 0% { opacity: 0; transform: translate3d(0,0,0); } 16% { opacity: 1; } 82% { opacity: 1; transform: translate3d(0,var(--arm-drop-distance),0); } 100% { opacity: 0; transform: translate3d(0,var(--arm-drop-distance),0); } }
    .game-result { margin: 14px 0 0; color: var(--muted); font-weight: 700; }
    .nice-leek { position: absolute; z-index: 12; display: none; padding: .12em .32em .2em; border: 3px solid #fff3a2; border-radius: .28em; background: radial-gradient(ellipse, #fff5ab 0%, #ffc928 48%, #e38b08 100%); color: #fffef0; font-size: clamp(2.8rem, 11vw, 5.6rem); font-weight: 1000; letter-spacing: -.04em; line-height: 1; text-shadow: 0 3px 0 #9b5300, 0 5px 10px #6b3900, 0 0 28px #ffe44f; box-shadow: 0 0 0 6px rgb(255 218 72 / 30%), 0 0 36px 12px rgb(255 218 72 / 76%); white-space: nowrap; pointer-events: none; }
    .nice-leek.show { display: block; animation: nice-leek-pop 1.9s cubic-bezier(.15,.8,.25,1) forwards; }
    @keyframes nice-leek-pop { 0% { opacity: 0; transform: translate(-50%,12px) scale(.45) rotate(-9deg); } 16% { opacity: 1; transform: translate(-50%,-10px) scale(1.3) rotate(4deg); } 30% { transform: translate(-50%,-16px) scale(1.12) rotate(-2deg); } 76% { opacity: 1; transform: translate(-50%,-66px) scale(1.08) rotate(0); } 100% { opacity: 0; transform: translate(-50%,-112px) scale(1.12); } }
    .dog-finish { position: fixed; z-index: 30; top: 50%; left: 0; width: min(160px, 28vw); max-height: 32vh; object-fit: contain; pointer-events: none; }
    .dog-finish[hidden] { display: none; }
    .dog-finish.running { animation: dog-finish-run 1.7s linear both; }
    @keyframes dog-finish-run { from { transform: translate(110vw,-50%); } to { transform: translate(-150%,-50%); } }
    footer { margin-top: 38px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; }
    dialog { width: min(94vw, 1100px); max-width: none; max-height: 92vh; padding: 0; border: 0; background: #171614; color: white; }
    dialog::backdrop { background: rgb(20 18 15 / 82%); }
    .viewer { position: relative; display: grid; place-items: center; min-height: 30vh; }
    .viewer img { display: block; max-width: 100%; max-height: 85vh; object-fit: contain; }
    .close { position: absolute; top: 10px; right: 10px; width: 42px; height: 42px; border: 1px solid rgb(255 255 255 / 55%); border-radius: 50%; background: rgb(0 0 0 / 55%); color: #fff; font-size: 1.5rem; cursor: pointer; }
    .steam-layer { position: fixed; z-index: 0; inset: 0; overflow: hidden; pointer-events: none; }
    .steam-circle { position: absolute; left: var(--left, 0px); bottom: var(--bottom, -10vh); width: var(--size, 220px); height: var(--size, 220px); border-radius: 50%; background: radial-gradient(circle, rgb(255 250 225 / 32%) 0 28%, rgb(255 250 225 / 21%) 48%, transparent 76%); filter: blur(22px); opacity: 0; }
    .steam-layer.rising .steam-circle { animation: steam-float var(--duration, 4.5s) cubic-bezier(.2,.55,.35,1) var(--delay, 0s) infinite both; }
    @keyframes steam-float {
      0% { opacity: 0; transform: translate3d(var(--start-x, 0px), 9vh, 0) scale(.78); }
      14% { opacity: var(--alpha, .5); }
      48% { transform: translate3d(var(--mid-x, 18px), -44vh, 0) scale(1); }
      78% { opacity: var(--alpha, .5); }
      100% { opacity: 0; transform: translate3d(var(--end-x, -12px), -112vh, 0) scale(1.18); }
    }
    .scroll-track { position: fixed; z-index: 4; top: 8px; right: 3px; bottom: 8px; width: 34px; touch-action: none; cursor: grab; user-select: none; }
    .scroll-track:active { cursor: grabbing; }
    .leek-thumb { position: absolute; top: 0; left: 3px; width: 28px; height: clamp(82px, 20vh, 150px); display: flex; align-items: center; justify-content: center; border-radius: 16px; outline: none; }
    .leek-thumb img { display: block; height: 100%; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(0 2px 3px rgb(53 54 24 / 30%)); pointer-events: none; }
    .leek-thumb:focus-visible { box-shadow: 0 0 0 3px #006241; }
    .dog-peek { position: fixed; z-index: 3; left: 12px; bottom: 0; width: clamp(42px, 5vw, 62px); max-height: 12vh; object-fit: contain; object-position: bottom center; filter: drop-shadow(0 1px 2px rgb(48 35 24 / 18%)); opacity: 0; transform: translateY(105%); transition: transform .7s cubic-bezier(.2,.8,.25,1), opacity .35s ease; pointer-events: none; }
    body.at-bottom .dog-peek { opacity: 1; transform: translateY(0); }
    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    @media (max-width: 760px) {
      .page { padding-right: 44px; padding-left: 18px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
      .image-button img { height: clamp(190px, 57vw, 360px); }
      .caption { display: block; }
      .words { margin-top: 3px; }
      .game-gate { min-height: 130px; }
      .game-table { grid-template-columns: minmax(0, 1fr) minmax(104px, 31%); gap: 8px; min-height: 280px; padding: 12px; border-width: 4px; border-radius: 22px; }
      .pot-zone { border-width: 8px; }
      .pot-broth { border-width: 3px; }
      .plate-zone { border-width: 6px; }
      .plate-content { grid-template-columns: repeat(2, 28px); gap: 5px; min-height: 62px; }
      .plate-tofu { width: 28px; }
      .plate-count { bottom: 14%; font-size: .68rem; }
      .scoop-net { width: 70px; border-width: 4px; }
      .pot-leek { width: clamp(30px, 10vw, 44px); }
    }
    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; gap: 24px; }
      .image-button img { height: min(115vw, 480px); }
      .pickup-card { width: 82px; height: 112px; }
      .game-table { grid-template-columns: minmax(0, 1fr) 95px; gap: 6px; padding: 9px; }
      .plate-zone { width: 95px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <div class="steam-layer" id="steam-layer" aria-hidden="true"><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i><i class="steam-circle"></i></div>
  <div class="scroll-track" id="scroll-track" role="scrollbar" aria-label="ページをスクロール" aria-controls="page-content" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="leek-thumb" id="leek-thumb"><img src="images/leek-scroll.png" alt=""></div></div>
  <img class="dog-peek" src="images/dog-peek.png" alt="ひょっこり現れる犬" aria-hidden="true">
  <img class="dog-finish" id="dog-finish" src="images/dog-peek.png" alt="" aria-hidden="true" hidden>
  <div class="page" id="page-content">
    <header>
      <p class="eyebrow">PERSONAL ARCHIVE</p>
      <h1>アーカイブサイト</h1>
      <p class="question">コーヒーを飲むと作業が捗るのはなぜか</p>
    </header>
    <main>
      <div class="collection-head">
        <h2>写真アーカイブ</h2>
        <p class="count">全 <span id="item-count">7</span> 件</p>
      </div>
      <section class="grid" id="archive" aria-label="写真アーカイブ">
        <article class="card"><button class="image-button" type="button" aria-label="01.jpgを拡大"><img src="images/01.jpg" alt="アーカイブ写真 01" loading="lazy"></button><div class="caption"><h3 class="name">01.jpg</h3><p class="words">きょう、湯豆腐やで。</p></div></article>
        <article class="card"><button class="image-button" type="button" aria-label="02.jpgを拡大"><img src="images/02.jpg" alt="アーカイブ写真 02" loading="lazy"></button><div class="caption"><h3 class="name">02.jpg</h3><p class="words">パパの手</p></div></article>
        <article class="card"><button class="image-button" type="button" aria-label="03.jpgを拡大"><img src="images/03.jpg" alt="アーカイブ写真 03" loading="lazy"></button><div class="caption"><h3 class="name">03.jpg</h3><p class="words">デザイン作り</p></div></article>
        <article class="card"><button class="image-button" type="button" aria-label="04.jpgを拡大"><img src="images/04.jpg" alt="アーカイブ写真 04" loading="lazy"></button><div class="caption"><h3 class="name">04.jpg</h3><p class="words">印刷しました</p></div></article>
        <article class="card"><button class="image-button" type="button" aria-label="05.jpgを拡大"><img src="images/05.jpg" alt="アーカイブ写真 05" loading="lazy"></button><div class="caption"><h3 class="name">05.jpg</h3><p class="words">これはキムチ鍋です</p></div></article>
        <article class="card"><button class="image-button" type="button" aria-label="06.jpgを拡大"><img src="images/06.jpg" alt="アーカイブ写真 06" loading="lazy"></button><div class="caption"><h3 class="name">06.jpg</h3><p class="words">４０パーオフです</p></div></article>
        <article class="card"><button class="image-button" type="button" aria-label="07.jpgを拡大"><img src="images/07.jpg" alt="アーカイブ写真 07" loading="lazy"></button><div class="caption"><h3 class="name">07.jpg</h3><p class="words">いいでしょ〜</p></div></article>
      </section>
    </main>
    <section class="game-section" id="tofu-game" aria-label="ミニゲーム">
      <div class="game-gate" id="game-gate">
        <button class="game-button" id="start-game" type="button">ミニゲームをスタート</button>
      </div>
      <div class="pickup-card" id="pickup-card" aria-hidden="true" hidden><img id="game-start-photo" src="images/01.jpg" alt=""></div>
      <div class="game-view" id="game-view" hidden>
        <p class="game-status" id="game-status" aria-live="polite">豆腐をゆっくり4個運びましょう。3秒経つと腕に潰されます。</p>
        <div class="game-table" id="game-table">
          <div class="pot-zone" aria-label="湯豆腐の鍋">
            <div class="pot-broth">
              <i class="pot-leaf"></i><i class="pot-leaf"></i><i class="pot-leaf"></i><i class="pot-leaf"></i>
              <button class="pot-leek" type="button" aria-label="ネギをすくう"><img src="images/leek-scroll.png" alt=""></button>
              <button class="pot-tofu tofu-1" type="button" aria-label="豆腐をすくう"></button>
              <button class="pot-tofu tofu-2" type="button" aria-label="豆腐をすくう"></button>
              <button class="pot-tofu tofu-3" type="button" aria-label="豆腐をすくう"></button>
              <button class="pot-tofu tofu-4" type="button" aria-label="豆腐をすくう"></button>
              <button class="pot-tofu tofu-5" type="button" aria-label="豆腐をすくう"></button>
              <button class="pot-tofu tofu-6" type="button" aria-label="豆腐をすくう"></button>
              <button class="pot-tofu tofu-7" type="button" aria-label="豆腐をすくう"></button>
            </div>
          </div>
          <div class="plate-zone" id="plate-zone" role="button" tabindex="0" aria-label="お皿に豆腐をよそう">
            <div class="plate-content" id="plate-content"></div>
            <span class="plate-count"><span id="served-count">0</span> / 4</span>
          </div>
          <div class="scoop-net" id="scoop-net" aria-hidden="true"></div>
          <img class="game-arm" id="game-arm" src="images/arm-crush.png" alt="" aria-hidden="true">
          <span class="nice-leek" id="nice-leek" aria-live="polite">nice ネギ</span>
        </div>
        <p class="game-result" id="game-result" aria-live="polite"></p>
        <button class="game-button" id="reset-game" type="button" hidden>もう一度あそぶ</button>
      </div>
    </section>
    <footer>アーカイブサイト</footer>
  </div>
  <dialog id="photo-viewer" aria-label="写真の拡大表示">
    <div class="viewer"><button class="close" type="button" aria-label="閉じる">×</button><img id="viewer-image" alt=""></div>
  </dialog>
  <script>
    const archive = document.querySelector('#archive');
    const viewer = document.querySelector('#photo-viewer');
    const viewerImage = document.querySelector('#viewer-image');
    const steamLayer = document.querySelector('#steam-layer');
    const scrollTrack = document.querySelector('#scroll-track');
    const leekThumb = document.querySelector('#leek-thumb');
    const gameGate = document.querySelector('#game-gate');
    const pickupCard = document.querySelector('#pickup-card');
    const gameStartPhoto = document.querySelector('#game-start-photo');
    const gameView = document.querySelector('#game-view');
    const gameTable = document.querySelector('#game-table');
    const gameStatus = document.querySelector('#game-status');
    const gameResult = document.querySelector('#game-result');
    const resetGameButton = document.querySelector('#reset-game');
    const scoopNet = document.querySelector('#scoop-net');
    const gameArm = document.querySelector('#game-arm');
    const dogFinish = document.querySelector('#dog-finish');
    const niceLeek = document.querySelector('#nice-leek');
    const plateZone = document.querySelector('#plate-zone');
    const plateContent = document.querySelector('#plate-content');
    const servedCountLabel = document.querySelector('#served-count');
    const tofuPieces = [...document.querySelectorAll('.pot-tofu')];
    let dragPointer = null;
    let selectedItem = null;
    let activePointerId = null;
    let lastMove = null;
    let servedCount = 0;
    let gameActive = false;
    let slowHazardTimer = null;
    let slowHazardToken = 0;
    let hazardAnimating = false;
    let niceLeekTimer = null;
    const randomizeSteam = () => {
      const photoWidth = archive.querySelector('.image-button').getBoundingClientRect().width || window.innerWidth / 3;
      steamLayer.querySelectorAll('.steam-circle').forEach((circle) => {
        const size = photoWidth * (.82 + Math.random() * .36);
        const left = Math.random() * Math.max(0, window.innerWidth - size);
        circle.style.setProperty('--size', `${size}px`);
        circle.style.setProperty('--left', `${left}px`);
        circle.style.setProperty('--bottom', `${-Math.random() * 24}vh`);
        circle.style.setProperty('--alpha', String(.3 + Math.random() * .28));
        circle.style.setProperty('--duration', `${3.8 + Math.random() * 2.4}s`);
        circle.style.setProperty('--delay', `${Math.random() * .7}s`);
        circle.style.setProperty('--start-x', `${Math.random() * 28 - 14}px`);
        circle.style.setProperty('--mid-x', `${Math.random() * 110 - 55}px`);
        circle.style.setProperty('--end-x', `${Math.random() * 100 - 50}px`);
      });
    };
    randomizeSteam();
    steamLayer.classList.add('rising');
    const updateScrollUI = () => {
      const trackHeight = scrollTrack.clientHeight;
      const thumbHeight = leekThumb.offsetHeight;
      const maxThumbTop = Math.max(0, trackHeight - thumbHeight);
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const progress = Math.min(1, window.scrollY / maxScroll);
      leekThumb.style.top = `${progress * maxThumbTop}px`;
      scrollTrack.setAttribute('aria-valuenow', String(Math.round(progress * 100)));
      document.body.classList.toggle('at-bottom', window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 8);
    };
    const scrollToTrackPoint = (clientY) => {
      const rect = scrollTrack.getBoundingClientRect();
      const maxThumbTop = Math.max(0, rect.height - leekThumb.offsetHeight);
      const top = Math.max(0, Math.min(maxThumbTop, clientY - rect.top - leekThumb.offsetHeight / 2));
      const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      window.scrollTo({ top: maxThumbTop ? (top / maxThumbTop) * maxScroll : 0, behavior: 'auto' });
    };
    const clearSlowHazard = () => {
      window.clearTimeout(slowHazardTimer);
      slowHazardTimer = null;
      slowHazardToken += 1;
    };
    const resetGame = () => {
      clearSlowHazard();
      selectedItem = null;
      activePointerId = null;
      lastMove = null;
      servedCount = 0;
      gameActive = true;
      hazardAnimating = false;
      tofuPieces.forEach((tofu) => {
        tofu.classList.remove('carried', 'broken', 'crushed', 'served');
        tofu.style.removeProperty('left');
        tofu.style.removeProperty('top');
      });
      document.querySelectorAll('.tofu-shard').forEach((shard) => shard.remove());
      const potLeek = document.querySelector('.pot-leek');
      potLeek.classList.remove('carried', 'taken', 'crushed');
      potLeek.style.removeProperty('left');
      potLeek.style.removeProperty('top');
      plateContent.replaceChildren();
      servedCountLabel.textContent = '0';
      gameStatus.textContent = '豆腐をゆっくり4個運びましょう。3秒経つと腕に潰されます。';
      gameResult.textContent = '';
      resetGameButton.hidden = true;
      scoopNet.classList.remove('active');
      gameArm.classList.remove('smashing');
      niceLeek.classList.remove('show');
      window.clearTimeout(niceLeekTimer);
    };
    const placeNetAt = (clientX, clientY) => {
      const tableRect = gameTable.getBoundingClientRect();
      scoopNet.style.left = `${clientX - tableRect.left}px`;
      scoopNet.style.top = `${clientY - tableRect.top}px`;
      scoopNet.classList.add('active');
    };
    const returnToPot = () => {
      if (!selectedItem) return;
      clearSlowHazard();
      selectedItem.classList.remove('carried');
      selectedItem.style.removeProperty('left');
      selectedItem.style.removeProperty('top');
      selectedItem = null;
      scoopNet.classList.remove('active');
    };
    const checkGameOver = () => {
      const available = tofuPieces.filter((tofu) => !['broken', 'crushed', 'served'].some((state) => tofu.classList.contains(state))).length;
      if (available < 4 - servedCount) {
        gameActive = false;
        gameStatus.textContent = 'お豆腐が足りなくなりました。';
        gameResult.textContent = 'もう一度、ゆっくりすくってみましょう。';
        resetGameButton.hidden = false;
      }
    };
    const playDogFinish = () => {
      dogFinish.hidden = false;
      dogFinish.classList.remove('running');
      void dogFinish.offsetWidth;
      dogFinish.classList.add('running');
      window.setTimeout(() => {
        dogFinish.classList.remove('running');
        dogFinish.hidden = true;
        gameView.hidden = true;
        gameGate.hidden = false;
        document.querySelector('#start-game').disabled = false;
        pickupCard.hidden = true;
        resetGame();
        updateScrollUI();
      }, 1750);
    };
    const breakSelectedTofu = () => {
      if (!selectedItem) return;
      clearSlowHazard();
      if (selectedItem.classList.contains('pot-leek')) {
        returnToPot();
        gameStatus.textContent = 'ネギが網から落ちました。';
        lastMove = null;
        return;
      }
      const tofu = selectedItem;
      const tofuRect = tofu.getBoundingClientRect();
      const soupRect = document.querySelector('.pot-broth').getBoundingClientRect();
      const centerX = tofuRect.left - soupRect.left + tofuRect.width / 2;
      const centerY = tofuRect.top - soupRect.top + tofuRect.height / 2;
      const fragments = [
        [-20,-13,-38,-42,-28], [0,-15,8,-56,22], [18,-10,42,-35,36],
        [-16,8,-48,24,-45], [3,8,8,38,27], [19,9,46,18,58]
      ];
      fragments.forEach(([dx,dy,moveX,moveY,turn]) => {
        const shard = document.createElement('i');
        shard.className = 'tofu-shard';
        shard.style.left = `${centerX + dx - 12}px`;
        shard.style.top = `${centerY + dy - 10}px`;
        shard.style.setProperty('--dx', `${moveX}px`);
        shard.style.setProperty('--dy', `${moveY}px`);
        shard.style.setProperty('--turn', `${turn}deg`);
        document.querySelector('.pot-broth').append(shard);
      });
      tofu.classList.remove('carried');
      tofu.classList.add('broken');
      tofu.style.removeProperty('left');
      tofu.style.removeProperty('top');
      selectedItem = null;
      scoopNet.classList.remove('active');
      gameStatus.textContent = '速すぎて豆腐がバラバラに崩れました！';
      checkGameOver();
    };
    const serveSelectedTofu = (clientX, clientY) => {
      if (!selectedItem || !gameActive) return;
      clearSlowHazard();
      const item = selectedItem;
      item.classList.remove('carried');
      item.style.removeProperty('left');
      item.style.removeProperty('top');
      selectedItem = null;
      scoopNet.classList.remove('active');
      if (item.classList.contains('pot-leek')) {
        item.classList.add('taken');
        const platedLeek = document.createElement('img');
        platedLeek.className = 'plate-leek';
        platedLeek.src = 'images/leek-scroll.png';
        platedLeek.alt = '';
        platedLeek.setAttribute('aria-hidden', 'true');
        plateContent.append(platedLeek);
        const tableRect = gameTable.getBoundingClientRect();
        niceLeek.style.left = '50%';
        niceLeek.style.top = `${clientY - tableRect.top}px`;
        niceLeek.classList.remove('show');
        void niceLeek.offsetWidth;
        niceLeek.classList.add('show');
        window.clearTimeout(niceLeekTimer);
        niceLeekTimer = window.setTimeout(() => niceLeek.classList.remove('show'), 1700);
        gameStatus.textContent = 'ネギをお皿によそいました！';
        return;
      }
      item.classList.add('served');
      servedCount += 1;
      servedCountLabel.textContent = String(servedCount);
      const platedTofu = document.createElement('span');
      platedTofu.className = 'plate-tofu';
      platedTofu.setAttribute('aria-hidden', 'true');
      plateContent.append(platedTofu);
      if (servedCount >= 4) {
        gameActive = false;
        gameStatus.textContent = 'クリア！';
        gameResult.textContent = '';
        resetGameButton.hidden = true;
        playDogFinish();
      } else {
        gameStatus.textContent = `いい調子です。あと${4 - servedCount}個、ゆっくり運びましょう。`;
      }
    };
    const triggerSlowHazard = () => {
      if (!selectedItem || !gameActive || hazardAnimating) return;
      hazardAnimating = true;
      window.clearTimeout(slowHazardTimer);
      slowHazardTimer = null;
      const item = selectedItem;
      const isLeek = item.classList.contains('pot-leek');
      item.classList.remove('carried');
      item.classList.add('crushed');
      item.style.removeProperty('left');
      item.style.removeProperty('top');
      selectedItem = null;
      activePointerId = null;
      lastMove = null;
      scoopNet.classList.remove('active');
      const tofuRect = item.getBoundingClientRect();
      const tableRect = gameTable.getBoundingClientRect();
      const targetX = tofuRect.left - tableRect.left + tofuRect.width / 2;
      const targetY = tofuRect.top - tableRect.top + tofuRect.height / 2;
      const armWidth = Math.min(270, Math.max(210, tableRect.width * .38));
      const armHeight = armWidth * 1.9;
      gameArm.style.width = `${armWidth}px`;
      gameArm.style.height = `${armHeight}px`;
      gameArm.style.left = `${Math.max(-18, targetX - armWidth * .3)}px`;
      const armFromTop = -armHeight - 12;
      const armTargetTop = targetY - armHeight * .98;
      gameArm.style.top = `${armFromTop}px`;
      gameArm.style.setProperty('--arm-drop-distance', `${armTargetTop - armFromTop}px`);
      gameArm.classList.remove('smashing');
      void gameArm.getBoundingClientRect();
      gameArm.classList.add('smashing');
      window.setTimeout(() => { gameArm.classList.remove('smashing'); hazardAnimating = false; }, 850);
      gameStatus.textContent = isLeek ? '腕にネギをつぶされました！' : '腕に豆腐をつぶされました！';
      checkGameOver();
    };
    const startSlowHazardTimer = () => {
      clearSlowHazard();
      const token = slowHazardToken;
      slowHazardTimer = window.setTimeout(() => {
        if (token !== slowHazardToken) return;
        triggerSlowHazard();
      }, 3000);
    };
    const moveSelectedItem = (event) => {
      if (!selectedItem) return;
      const now = event.timeStamp;
      if (lastMove) {
        const elapsed = Math.max(1, now - lastMove.time);
        const distance = Math.hypot(event.clientX - lastMove.x, event.clientY - lastMove.y);
        if (distance / elapsed > 2.1) {
          breakSelectedTofu();
          return;
        }
      }
      lastMove = { x: event.clientX, y: event.clientY, time: now };
      placeNetAt(event.clientX, event.clientY);
      const soupRect = document.querySelector('.pot-broth').getBoundingClientRect();
      selectedItem.style.left = `${event.clientX - soupRect.left - selectedItem.offsetWidth / 2}px`;
      selectedItem.style.top = `${event.clientY - soupRect.top - selectedItem.offsetHeight / 2}px`;
    };
    const startGame = () => {
      const photoSources = [...archive.querySelectorAll('.image-button img')].map((img) => img.src);
      gameStartPhoto.src = photoSources[Math.floor(Math.random() * photoSources.length)];
      const buttonRect = document.querySelector('#start-game').getBoundingClientRect();
      pickupCard.style.left = `${buttonRect.left + buttonRect.width / 2}px`;
      pickupCard.style.top = `${buttonRect.top - 136}px`;
      pickupCard.hidden = false;
      pickupCard.classList.remove('lifting');
      void pickupCard.offsetWidth;
      pickupCard.classList.add('lifting');
      document.querySelector('#start-game').disabled = true;
      window.setTimeout(() => {
        gameGate.hidden = true;
        pickupCard.hidden = true;
        pickupCard.classList.remove('lifting');
        gameView.hidden = false;
        resetGame();
        updateScrollUI();
      }, 790);
    };
    document.querySelector('#start-game').addEventListener('click', startGame);
    resetGameButton.addEventListener('click', resetGame);
    gameTable.addEventListener('pointerdown', (event) => {
      const item = event.target.closest('.pot-tofu, .pot-leek');
      if (!gameActive || !item || ['broken', 'crushed', 'served', 'taken'].some((state) => item.classList.contains(state)) || selectedItem) return;
      event.preventDefault();
      selectedItem = item;
      activePointerId = event.pointerId;
      lastMove = { x: event.clientX, y: event.clientY, time: event.timeStamp };
      item.classList.add('carried');
      placeNetAt(event.clientX, event.clientY);
      gameTable.setPointerCapture(event.pointerId);
      startSlowHazardTimer();
      gameStatus.textContent = item.classList.contains('pot-leek') ? 'ネギをお皿まで運びましょう。' : 'そのまま、ゆっくりお皿まで運びましょう。';
    });
    gameTable.addEventListener('pointermove', (event) => {
      if (event.pointerId === activePointerId) moveSelectedItem(event);
    });
    gameTable.addEventListener('pointerup', (event) => {
      if (event.pointerId !== activePointerId) return;
      const plateRect = plateZone.getBoundingClientRect();
      const onPlate = event.clientX >= plateRect.left && event.clientX <= plateRect.right && event.clientY >= plateRect.top && event.clientY <= plateRect.bottom;
      activePointerId = null;
      lastMove = null;
      if (selectedItem && onPlate) serveSelectedTofu(event.clientX, event.clientY);
      else if (selectedItem) { returnToPot(); gameStatus.textContent = 'お皿の中で指をはなすと、よそえます。'; }
    });
    gameTable.addEventListener('pointercancel', () => { activePointerId = null; lastMove = null; returnToPot(); });
    gameTable.addEventListener('click', (event) => {
      if (event.detail !== 0 || !gameActive) return;
      const item = event.target.closest('.pot-tofu, .pot-leek');
      if (!item || ['broken', 'crushed', 'served', 'taken'].some((state) => item.classList.contains(state))) return;
      if (selectedItem === item) { returnToPot(); return; }
      if (selectedItem) return;
      selectedItem = item;
      item.classList.add('carried');
      startSlowHazardTimer();
      const rect = item.getBoundingClientRect();
      placeNetAt(rect.left + rect.width / 2, rect.top + rect.height / 2);
      gameStatus.textContent = 'お皿にフォーカスして選ぶと、よそえます。';
    });
    plateZone.addEventListener('click', (event) => {
      if (event.detail === 0 && selectedItem) {
        const rect = plateZone.getBoundingClientRect();
        serveSelectedTofu(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
    });
    document.querySelector('#item-count').textContent = archive.querySelectorAll('.card').length;
    window.addEventListener('scroll', () => {
      updateScrollUI();
    }, { passive: true });
    window.addEventListener('resize', updateScrollUI);
    scrollTrack.addEventListener('pointerdown', (event) => {
      dragPointer = event.pointerId;
      scrollTrack.setPointerCapture(dragPointer);
      scrollToTrackPoint(event.clientY);
      event.preventDefault();
    });
    scrollTrack.addEventListener('pointermove', (event) => {
      if (dragPointer === event.pointerId) scrollToTrackPoint(event.clientY);
    });
    scrollTrack.addEventListener('pointerup', () => { dragPointer = null; });
    scrollTrack.addEventListener('pointercancel', () => { dragPointer = null; });
    scrollTrack.addEventListener('keydown', (event) => {
      const step = event.shiftKey ? window.innerHeight * .8 : 90;
      if (event.key === 'ArrowDown' || event.key === 'ArrowRight') { window.scrollBy({ top: step }); event.preventDefault(); }
      if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') { window.scrollBy({ top: -step }); event.preventDefault(); }
      if (event.key === 'PageDown') { window.scrollBy({ top: window.innerHeight * .9 }); event.preventDefault(); }
      if (event.key === 'PageUp') { window.scrollBy({ top: -window.innerHeight * .9 }); event.preventDefault(); }
      if (event.key === 'Home') { window.scrollTo({ top: 0 }); event.preventDefault(); }
      if (event.key === 'End') { window.scrollTo({ top: document.documentElement.scrollHeight }); event.preventDefault(); }
    });
    updateScrollUI();
    archive.addEventListener('click', (event) => {
      const button = event.target.closest('.image-button');
      if (!button) return;
      const image = button.querySelector('img');
      viewerImage.src = image.src;
      viewerImage.alt = image.alt;
      viewer.showModal();
    });
    document.querySelector('.close').addEventListener('click', () => viewer.close());
    viewer.addEventListener('click', (event) => {
      if (event.target === viewer) viewer.close();
    });
    viewer.addEventListener('close', () => { viewerImage.removeAttribute('src'); });
  </script>
</body>
</html>
